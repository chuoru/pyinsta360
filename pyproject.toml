[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "pyinsta360"
version = "0.1.0"
description = "Python bindings for the Insta360 CameraSDK (X3 tested; X4/X5 nominal)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
decode = ["av>=12"]
test = ["pytest>=7", "av>=12"]

[tool.scikit-build]
cmake.version = ">=3.18"
cmake.build-type = "Release"
wheel.packages = ["python/pyinsta360"]
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
