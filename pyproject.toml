[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "pyinsta360"
version = "0.1.1"
description = "Python bindings for the Insta360 CameraSDK (X3 tested; X4/X5 nominal)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "chuoru", email = "tranvietthanh0101@gmail.com" }]
keywords = ["insta360", "camera", "360", "imu", "pybind11", "robotics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Video :: Capture",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.21"]

[project.urls]
Homepage = "https://github.com/chuoru/pyinsta360"
Issues = "https://github.com/chuoru/pyinsta360/issues"

[project.optional-dependencies]
decode = ["av>=12"]
test = ["pytest>=7", "av>=12"]

[tool.scikit-build]
cmake.version = ">=3.18"
cmake.build-type = "Release"
wheel.packages = ["python/pyinsta360"]
build-dir = "build/{wheel_tag}"
sdist.exclude = [".claude", ".gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
